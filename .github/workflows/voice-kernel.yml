# Voice Kernel — Pack 0 (rootless) build workflow — DRAFT
# Implements BUILD_PLAN.md §2–§4. Everything runs on the GitHub runner.
# Items marked PIN: must be fixed to exact values when this is adopted into a repo.
name: Voice Kernel (Pack 0, rootless)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 1. Free disk space
        uses: easimon/maximize-build-space@v10
        with:
          # Reserves proven by the AERA builds on this same runner class.
          # Build #2 died because root-reserve-mb 4096 left root too tight
          # for apt (disk full during `apt-get update` in step 2, both
          # attempts); AERA build #6 also showed small reserves break this
          # step. These values pass and leave root room for apt.
          root-reserve-mb: 16384
          temp-reserve-mb: 12288
          swap-file-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: 2. Install build deps
        run: |
          # Build #2 died here: disk full during apt-get update (both attempts).
          # Clear apt's own cache + stale lists first, show free space, then
          # update. If root is still under 10G free, fail fast with the numbers.
          df -h / /tmp "$GITHUB_WORKSPACE"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip xz-utils kmod cpio python3
          df -h /

      - name: 3. Clone sources (stock snapshot + OpenELA full history)
        run: |
          # Stock: MiCode/Xiaomi_Kernel_OpenSource @ camellian-t-oss
          #   HEAD f4e416aea06c81f1e661d0524c0554f0538d11cb (Linux 4.14.186)
          git clone --depth 1 --branch camellian-t-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git stock
          # OpenELA: openela/kernel-lts @ linux-4.14.y — FULL history (needed for graft base)
          #   tip 1e6347375d088ecc896aabb067131d0f9e3c0575 (tag v4.14.357-openela, Linux 4.14.357)
          git clone --branch linux-4.14.y \
            https://github.com/openela/kernel-lts.git openela
          # Voice repo (this workflow's own repo): carries merge-overlay/resolved/
          # (the 114 burn-down files for the merge gate). Cloned HERE, after
          # maximize-build-space (step 1) — that step mounts a fresh volume over
          # $GITHUB_WORKSPACE and would hide anything checked out before it
          # (same lesson as the AERA tree.zip: re-fetch after the mount).
          git clone --depth 1 \
            https://github.com/HIZVOICE/voice-kernel-camellia.git voice-repo

      - name: 4. Graft stock onto OpenELA 4.14.186, merge to v4.14.357-openela
        run: |
          cd openela
          # Locate the 4.14.186 point in OpenELA history (no v4.14.186 tag exists):
          # walk Makefile history to the newest commit whose SUBLEVEL is 186.
          BASE=""
          for c in $(git log --format=%H -- Makefile); do
            if git show $c:Makefile | grep -q '^SUBLEVEL = 186$'; then BASE=$c; break; fi
          done
          test -n "$BASE" && echo "OpenELA 4.14.186 base: $BASE"
          # Import the stock tree as one commit on top of nothing, then graft.
          git checkout --orphan voice-base
          git rm -rf . >/dev/null 2>&1 || true
          rsync -a --exclude=.git ../stock/ ./
          git add -A
          git -c user.email=voice@local -c user.name=voice commit -m "stock camellian-t-oss f4e416ae (4.14.186)"
          git replace --graft voice-base $BASE
          # True two-sided merge to the OpenELA tip:
          set +e
          git -c user.email=voice@local -c user.name=voice merge \
            -m "merge OpenELA v4.14.357-openela" v4.14.357-openela
          MERGE_RC=$?
          set -e
          git diff --name-only --diff-filter=U > ../merge-conflicts.txt || true
          echo "conflicted files: $(wc -l < ../merge-conflicts.txt)"
          cp ../merge-conflicts.txt ../merge-conflicts-orig.txt
          echo "merge exit code: $MERGE_RC (non-zero is expected — conflicts are resolved by the overlay below)"
          # --- Merge overlay: burn-down resolutions (117/117) ---
          # Build #1 died here with exactly 117 conflicts. They are resolved in
          # merge-overlay/resolved/ (174 files, shipped as merge-overlay.zip in
          # the voice-kernel repo and unzipped here — see
          # merge-repro/BURNDOWN_REPORT.md for the accounting).
          # Overlay them BEFORE the conflict gate runs, so the gate sees a clean
          # tree. The overlay covers:
          #   * 113 conflict resolutions copied over the merged tree, plus
          #   * the mt6833 vcodec PM port (resolved/.../mt6833/mtk_vcodec_dec_pm.c),
          #     which is OUTSIDE the 117-file conflict list — the gate alone
          #     would never produce it, so it is included explicitly here.
          #   * the overflow.h clean-merge fix (resolved/include/linux/overflow.h),
          #     also OUTSIDE the 117-file conflict list — the merge cleanly kept
          #     BOTH sides' struct_size macro (stock's + OpenELA's), and the
          #     duplicate killed build #7 at mm/vmalloc.o (-Werror). Only the
          #     stock copy is removed; OpenELA's stays.
          #   * the fs1815n clean-merge fix (resolved/sound/soc/mediatek/fs1815n/
          #     fsm-dev.h + fsm_core.c), also OUTSIDE the 117-file conflict
          #     list — the merge cleanly kept stock's BIT redefinition vs
          #     OpenELA's bits.h and an unused variable, which killed build #9
          #     at sound/soc/mediatek/fs1815n/fsm_core.o (-Werror). BIT is now
          #     #ifndef-guarded; the unused i2sctrl is removed.
          #   * the f2fs + clkdbg fixes (resolved/fs/f2fs/f2fs.h +
          #     resolved/drivers/clk/mediatek/clkdbg.c), also OUTSIDE the
          #     117-file conflict list — the merge kept stock's f2fs.h (no
          #     f2fs_msg declaration, so segment.c failed in build #10) and
          #     stock's clkdbg.c has latent u32/u32* mismatches that Clang
          #     -Werror promotes to errors. f2fs.h now declares f2fs_msg;
          #     clkdbg.c dereferences the single status word and takes a
          #     scalar in save_all_clks_state.
          #   * the clkdbg-mt6833 + route fixes (resolved/drivers/clk/mediatek/
          #     clkdbg-mt6833.c + clk-mux.h, resolved/net/ipv4/route.c) — the
          #     mt6833 driver is stock-only and includes <clk-mux.h> (angle
          #     brackets), which no -I path covers; the sibling uses quotes,
          #     so line 23 is quoted now and the header ships verbatim.
          #     route.c was conflict #98 — the burn-down kept BOTH sides'
          #     uncached-list block; the static (tip) copy is deleted, the
          #     non-static (stock) copy stays, because stock's route.h
          #     declares both functions non-static.
          #   * the cpuidle fix (resolved/drivers/cpuidle/cpuidle-mediatek.c),
          #     stock-only — line 19 included <dt_idle_states.h> (angle
          #     brackets), which no -I path covers; the sibling uses quotes,
          #     so line 19 is quoted now. Same bug class as clkdbg-mt6833.c;
          #     the tree was swept for other instances and none was found.
          #   * the helio-dvfsrc + full-tree sweep fixes (52 new files, 82
          #     include sites, all angle -> quotes) — build #13 died on the
          #     same bug class a third time (helio-dvfsrc-qos.c:32), because
          #     the build #12 sweep only checked the overlay + a partial
          #     cache. This time the FULL stock (78,342 files) and tip
          #     (45,634 files) trees were shallow-cloned and swept with an
          #     -I-coverage filter + Kconfig closure (392 defconfig =y ->
          #     2,708 resolved =y). Every reachable real instance is fixed:
          #     helio-dvfsrc-v3 (15 files), audio_ipi framework (8), lpm
          #     mt6833 (9), battery (5), devmpu/smi (2), cache-auditor /
          #     dbgtop / debug_latch / leds / perf / tee_sanity / timer /
          #     typec / pinctrl / spmi / watchdog (14). 577 unreachable real
          #     candidates remain (staging, other-platform, other-arch) —
          #     none can be compiled by this defconfig.
          #   * 4 files stock deleted (removed below, not copied):
          #       crypto/chacha20_generic.c, include/crypto/chacha20.h,
          #       lib/chacha20.c, drivers/media/platform/mtk-vcodec/mtk_vcodec_dec_pm.c
          OVERLAY_ZIP="$GITHUB_WORKSPACE/voice-repo/merge-overlay.zip"
          test -f "$OVERLAY_ZIP" || { echo "::error::merge overlay zip missing at $OVERLAY_ZIP — the voice-kernel repo must contain merge-overlay.zip"; exit 1; }
          unzip -q "$OVERLAY_ZIP" -d "$GITHUB_WORKSPACE/voice-repo/"
          OVERLAY="$GITHUB_WORKSPACE/voice-repo/merge-overlay/resolved"
          test -d "$OVERLAY" || { echo "::error::merge overlay missing at $OVERLAY — the voice-kernel repo must contain merge-overlay/resolved/ (174 files)"; exit 1; }
          OVERLAY_N="$(find "$OVERLAY" -type f | wc -l)"
          echo "overlay files: $OVERLAY_N (expect 174)"
          [ "$OVERLAY_N" -eq 174 ] || { echo "::error::overlay has $OVERLAY_N files, expected 174 — stale or incomplete overlay in the repo"; exit 1; }
          cp -a "$OVERLAY/." ./
          rm -f crypto/chacha20_generic.c include/crypto/chacha20.h lib/chacha20.c \
            drivers/media/platform/mtk-vcodec/mtk_vcodec_dec_pm.c
          # Soundness: every conflicted path must be covered by the overlay or by
          # one of the 4 deletions — otherwise `git add` below would silently
          # mark an uncovered file resolved while its conflict markers are still
          # in it. Check coverage BEFORE staging anything.
          MISSING=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
              crypto/chacha20_generic.c|include/crypto/chacha20.h|lib/chacha20.c|drivers/media/platform/mtk-vcodec/mtk_vcodec_dec_pm.c) continue ;;
            esac
            [ -f "$OVERLAY/$p" ] || MISSING="$MISSING $p"
          done < ../merge-conflicts.txt
          if [ -n "$MISSING" ]; then
            echo "::error::overlay does not cover these conflicted files:$MISSING"
            exit 1
          fi
          git add -A
          # Gate now keys on remaining unmerged paths and on stray markers, NOT
          # on the original merge exit code (the merge exits non-zero by design —
          # the overlay is what resolves it).
          git diff --name-only --diff-filter=U > ../merge-conflicts.txt || true
          echo "conflicted files after overlay: $(wc -l < ../merge-conflicts.txt)"
          if [ -s ../merge-conflicts.txt ]; then
            echo "::error::Merge still has unresolved conflicts after overlay — see merge-conflicts.txt artifact."
            exit 1
          fi
          # Scope the marker check to the files that were actually conflicted.
          # Build #3 died here on a FALSE POSITIVE: a whole-tree grep trips on
          # a legitimate '<<<<<<<' inside a debug string in the STOCK kernel
          # (kernel/locking/spinlock_debug.c: pr_info("... Let's KE <<<...")),
          # which is pre-existing stock code, not a merge conflict. The overlay
          # files themselves are verified marker-free. Check only the 117
          # conflicted files (saved before the overlay) and name any offender.
          MARKED=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
              crypto/chacha20_generic.c|include/crypto/chacha20.h|lib/chacha20.c|drivers/media/platform/mtk-vcodec/mtk_vcodec_dec_pm.c) continue ;;
            esac
            if grep -q '<<<<<<<' "$p" 2>/dev/null || grep -q '>>>>>>>' "$p" 2>/dev/null; then
              MARKED="$MARKED $p"
            fi
          done < ../merge-conflicts-orig.txt
          if [ -n "$MARKED" ]; then
            echo "::error::conflict markers remain in these files after overlay:$MARKED"
            exit 1
          fi
          # Balance check (build #4 lesson): a resolved Makefile with a lost
          # endif dies at compile with a bare "missing endif". Every
          # Makefile-style file the overlay touched must balance if/endif.
          # Make enforces per-file balance, so this can only fail on files
          # that would break the build anyway. Fail naming the file.
          BAL_BAD=""
          for f in $(find "$OVERLAY" -type f \( -name 'Makefile*' -o -name '*.mk' \)); do
            tgt="${f#$OVERLAY/}"
            n_if=$(grep -cE '^(ifeq|ifdef|ifndef|ifneq)' "$tgt" || true)
            n_end=$(grep -cE '^endif' "$tgt" || true)
            [ "$n_if" -eq "$n_end" ] || BAL_BAD="$BAL_BAD $tgt($n_if/$n_end)"
          done
          if [ -n "$BAL_BAD" ]; then
            echo "::error::unbalanced if/endif in overlay Makefiles:$BAL_BAD"
            exit 1
          fi
          # Conclude the merge so the tree is clean for the build.
          git -c user.email=voice@local -c user.name=voice commit --no-edit -m "merge OpenELA v4.14.357-openela (+ burn-down overlay 117/117)"
          head -5 Makefile

      - name: 5. Upload merge conflict report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-conflicts
          path: merge-conflicts.txt

      - name: 6. Fetch pinned Clang
        env:
          # PIN VERIFIED 2026-11-07 (see flyme-ksu-bump/PREP.md §6 + BUILD_PLAN.md §4):
          # AOSP Clang r547379 = Clang 20.0.0, branch aosp-llvm-r547379-release.
          # URL re-verified live (HTTP 200, application/x-gzip) and COMPILE-PROVEN:
          # the Flyme BakaSU rebuild (build #2, run 42348014304) built 4.14.357
          # with this exact tarball (compile 5m20s). This supersedes BUILD_PLAN
          # §4's r450784e/clang-14 suggestion, whose AOSP archive URL does not
          # resolve (HTTP 400/404). No sha256 was ever published for this
          # tarball — verification is URL liveness + the version assertion below
          # (clang --version must report 20.0.0). Do not invent a sha.
          CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -fsSL "$CLANG_URL" -o /tmp/clang-r547379.tar.gz
          tar -xzf /tmp/clang-r547379.tar.gz -C "$GITHUB_WORKSPACE/clang"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -1
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | grep -q "20.0.0" || { echo "::error::clang version is not 20.0.0 (r547379)"; exit 1; }
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"

      - name: 7. Configure + build Image.gz-dtb
        run: |
          cd openela
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               camellian_defconfig
          ./scripts/config --set-str LOCALVERSION "-Voice"
          # Pack 0: stock defconfig enables CONFIG_LTO_CLANG (ThinLTO), but
          # the Pack-0 link uses GNU ld.gold, which rejects
          # --thinlto-cache-dir -- build #5 died at the vDSO link on it.
          # ThinLTO returns properly with LLD in Pack 1; for Pack 0 build
          # LTO off, exactly like the proven Flyme build (same Clang, GNU ld).
          ./scripts/config --disable THINLTO
          ./scripts/config --disable LTO_CLANG
          # Build #6: the config edits left a new Kconfig symbol
          # (RANDOMIZE_MODULE_REGION_FULL) without a value, and the build's
          # silentoldconfig prompted for it interactively -- which aborts
          # with no TTY in CI. olddefconfig assigns defaults to any such
          # symbol without prompting, so the build can proceed.
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               olddefconfig
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               -j$(nproc) Image.gz-dtb
          ls -la arch/arm64/boot/Image.gz-dtb

      - name: 8. Package AnyKernel3 zip (rootless)
        run: |
          # PIN VERIFIED 2026-11-07 (see flyme-ksu-bump/PREP.md §1):
          # osm0sis/AnyKernel3 @ e4b1bb25ca2aabcfd57f694a5998d87130701b71
          # ("AK3: usage/documentation comment touchups", 2026-08-10, osm0sis).
          # Verified via GitHub API (commit object exists) + ak3-core.sh at that
          # commit is byte-identical to the verified v6 zip's (sha256
          # f7a51cfe2e093016a34a76e16de6c9885c2d1992c3482fcabc668680e1f0f6bb;
          # AK_BASE_VERSION=20260809 in the template's updater-script).
          # COMPILE-PROVEN: the Flyme BakaSU rebuild (build #2) packaged its
          # working zip with this exact pin.
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout e4b1bb25ca2aabcfd57f694a5998d87130701b71
          test "$(git -C ak3 rev-parse HEAD)" = e4b1bb25ca2aabcfd57f694a5998d87130701b71
          cp openela/arch/arm64/boot/Image.gz-dtb ak3/
          # anykernel.sh: reviewed Voice file from the voice-kernel repo
          # (modelled on the verified v6 package, only kernel.string changed
          # to "Voice 4.14.357-openela — Pack 0 (rootless)"). Replaces the
          # AK3 template's generic anykernel.sh — the template has no
          # devicecheck/block values for camellia.
          test -f "$GITHUB_WORKSPACE/voice-repo/anykernel.sh" || { echo "::error::anykernel.sh missing in voice-kernel repo"; exit 1; }
          cp "$GITHUB_WORKSPACE/voice-repo/anykernel.sh" ak3/anykernel.sh
          cd ak3 && zip -r9 ../AnyKernel3-camellia-Voice-v0-noroot.zip . -x '.git/*'

      - name: 9. Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-camellia-Voice-v0-noroot
          path: AnyKernel3-camellia-Voice-v0-noroot.zip
